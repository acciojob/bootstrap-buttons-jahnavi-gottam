<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Buttons</title>

    <!-- Bootstrap CSS -->
    <link
        rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
    >
</head>

<body>

    <div class="container">
        <h4>Bootstrap Buttons</h4>

        <button id="button-1" class="btn btn-primary">
            Button-1
        </button>

        <button id="button-2" class="btn btn-outline-secondary">
            Button-2
        </button>

        <button id="button-3" class="btn btn-success btn-lg">
            Button-3
        </button>

        <button id="button-4" class="btn btn-danger btn-sm">
            Button-4
        </button>

        <button id="button-5" class="btn btn-warning btn-lg btn-block">
            Button-5
        </button>

        <button id="button-6" class="btn btn-info" disabled>
            Button-6
        </button>

        <button id="button-7" class="btn btn-light">
            Button-7
        </button>

        <button id="button-8" class="btn btn-link">
            Button-8
        </button>

    </div>

</body>
</html>
